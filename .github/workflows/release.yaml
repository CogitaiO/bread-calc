name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev pkg-config libwayland-dev libxkbcommon-dev libegl1-mesa-dev
      - name: Test
        run: go test ./...
      - name: Verify GUI build
        run: ./build-gui.sh "${RUNNER_TEMP}/breadcalc-gui"
      - name: Verify native Wayland GUI build
        run: ./build-gui.sh --wayland "${RUNNER_TEMP}/breadcalc-gui-wayland"
      - name: Build
        run: ./build.sh "${GITHUB_REF_NAME}"
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
